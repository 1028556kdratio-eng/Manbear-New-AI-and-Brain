plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title': mod_id, 'Specification-Vendor': mod_authors,
        'Specification-Version': '1', 'Implementation-Title': project.name,
        'Implementation-Version': project.jar.archiveVersion, 'Implementation-Vendor': mod_authors
    ])
    // Forge 1.20.1 discovers each mod JAR as a resource pack. Explicitly include
    // pack.mcmeta at the JAR root so the resource metadata is never omitted.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/resources') {
        include 'pack.mcmeta'
        into ''
    }
    finalizedBy 'reobfJar'
}

// Check the final (reobfuscated) JAR rather than allowing a bad artifact to be
// produced silently. The metadata must be at the archive root for Forge 1.20.1.
tasks.register('verifyPackMetadata') {
    dependsOn 'reobfJar'
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!jarFile.isFile()) {
            throw new GradleException("Expected mod JAR was not produced: ${jarFile}")
        }
        def archive = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = archive.getEntry('pack.mcmeta')
            if (entry == null) {
                throw new GradleException("${jarFile.name} is missing pack.mcmeta at the JAR root")
            }
            def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(entry))
            def pack = metadata instanceof Map ? metadata.pack : null
            if (!(pack instanceof Map) || !(pack.pack_format instanceof Number) ||
                    pack.pack_format.intValue() != 15 || !(pack.description instanceof String)) {
                throw new GradleException("${jarFile.name} has invalid Minecraft 1.20.1 pack.mcmeta metadata")
            }
        } finally {
            archive.close()
        }
        logger.lifecycle("Verified pack.mcmeta at the root of ${jarFile.name}")
    }
}

tasks.named('build').configure {
    dependsOn 'verifyPackMetadata'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
